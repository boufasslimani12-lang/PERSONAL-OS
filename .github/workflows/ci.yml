name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type check · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser smoke tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - run: npm ci
      # A throwaway local stack (Docker). Production data is never touched; tests/e2e/env.ts enforces it.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit
      - name: Export local Supabase settings
        run: |
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' | sed 's/"//g' > .supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep ^API_URL .supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep ^PUBLISHABLE_KEY .supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "::add-mask::$(grep ^SECRET_KEY .supabase.env | cut -d= -f2-)"
          echo "E2E_SUPABASE_SECRET_KEY=$(grep ^SECRET_KEY .supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          rm .supabase.env
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
